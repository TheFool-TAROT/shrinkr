services:
  shrinkr:
    build: .
    image: ghcr.io/TheFool-TAROT/shrinkr:latest
    container_name: shrinkr
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SHRINKR_BASE_URL: http://localhost:8000
      SHRINKR_ADMIN_TOKEN: change-me
      SHRINKR_RATE_LIMIT: "60"
      SHRINKR_RATE_WINDOW: "60"
      SHRINKR_TRUST_PROXY: "0"
      SHRINKR_DEFAULT_TTL: "0"
    volumes:
      - shrinkr-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  shrinkr-data: